<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Laboratorio XR - Modelo CAD</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Gestión de Recursos (Assets) -->
    <a-assets>
      <a-asset-item id="modeloCAD" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Fondo y Piso -->
    <a-sky color="#ECECEC"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="15" height="15" color="#7BC8A4"></a-plane>

    <!-- Entidad del Modelo CAD -->
    <a-entity gltf-model="#modeloCAD" position="0 1 0" scale="0.01 0.01 0.01"></a-entity>
  </a-scene>
</body>
</html>

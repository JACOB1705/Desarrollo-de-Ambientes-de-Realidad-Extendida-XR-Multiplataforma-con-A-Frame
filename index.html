<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Laboratorio XR - Entorno Industrial Complejo</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene shadow="type: pcfsoft">
    
    <!-- ============================================ -->
    <!-- 1. GESTIÓN DE RECURSOS (ASSETS)              -->
    <!-- ============================================ -->
    <a-assets>
      <a-asset-item id="modeloCAD" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- ============================================ -->
    <!-- 2. ILUMINACIÓN INDUSTRIAL (Destaca el CAD)   -->
    <!-- ============================================ -->
    <!-- Luz Ambiental Base -->
    <a-light type="ambient" color="#90A4AE" intensity="0.6"></a-light>
    
    <!-- Luz Principal (Foco Industrial con Sombras) -->
    <a-light type="directional" position="5 12 4" intensity="1.2" color="#FFF8E7" castShadow="true"></a-light>
    
    <!-- Luz de Relleno Contrapuesta (Evita que el CAD se vea negro) -->
    <a-light type="directional" position="-5 8 -2" intensity="0.7" color="#E0F7FA"></a-light>

    <!-- Foco Puntual sobre la Celda de Trabajo -->
    <a-light type="point" position="0 6 -3" intensity="0.8" distance="10" color="#FFE0B2"></a-light>

    <!-- ============================================ -->
    <!-- 3. NAVE INDUSTRIAL (Estructura y Paredes)   -->
    <!-- ============================================ -->
    <!-- Techado de Nave / Cielo Oscuro -->
    <a-sky color="#1A202C"></a-sky>

    <!-- Piso Industrial Principal (Concreto Oscuro) -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#2D3748" metalness="0.2" roughness="0.8" receiveShadow="true"></a-plane>

    <!-- Pared Trasera -->
    <a-plane position="0 6 -12" rotation="0 0 0" width="30" height="12" color="#3B4252"></a-plane>
    <!-- Pared Izquierda -->
    <a-plane position="-15 6 0" rotation="0 90 0" width="30" height="12" color="#313846"></a-plane>
    <!-- Pared Derecha -->
    <a-plane position="15 6 0" rotation="0 -90 0" width="30" height="12" color="#313846"></a-plane>

    <!-- Columnas Estructurales de Acero -->
    <a-box position="-14.5 6 -11.5" width="1" height="12" depth="1" color="#1F2937"></a-box>
    <a-box position="14.5 6 -11.5" width="1" height="12" depth="1" color="#1F2937"></a-box>
    <a-box position="-14.5 6 0" width="1" height="12" depth="1" color="#1F2937"></a-box>
    <a-box position="14.5 6 0" width="1" height="12" depth="1" color="#1F2937"></a-box>

    <!-- Vigas Superiores de Carga (Amarillo Industrial) -->
    <a-box position="0 11.5 -11.5" width="30" height="0.6" depth="0.6" color="#F59E0B"></a-box>
    <a-box position="0 11.5 -3" width="30" height="0.6" depth="0.6" color="#F59E0B"></a-box>

    <!-- Lámparas Colgantes de Techo -->
    <a-entity position="0 11 -3">
      <a-cylinder radius="0.04" height="1" color="#111111" position="0 0.5 0"></a-cylinder>
      <a-cone radius-bottom="0.6" radius-top="0.1" height="0.4" color="#374151" position="0 0 0"></a-cone>
    </a-entity>
    <a-entity position="-5 11 -3">
      <a-cylinder radius="0.04" height="1" color="#111111" position="0 0.5 0"></a-cylinder>
      <a-cone radius-bottom="0.6" radius-top="0.1" height="0.4" color="#374151" position="0 0 0"></a-cone>
    </a-entity>
    <a-entity position="5 11 -3">
      <a-cylinder radius="0.04" height="1" color="#111111" position="0 0.5 0"></a-cylinder>
      <a-cone radius-bottom="0.6" radius-top="0.1" height="0.4" color="#374151" position="0 0 0"></a-cone>
    </a-entity>

    <!-- Tuberías de Servicios (Gas, Aire, Agua) -->
    <a-cylinder position="0 9 -11.8" rotation="0 0 90" radius="0.1" height="30" color="#EF4444"></a-cylinder>
    <a-cylinder position="0 8.7 -11.8" rotation="0 0 90" radius="0.08" height="30" color="#3B82F6"></a-cylinder>
    <a-cylinder position="0 8.4 -11.8" rotation="0 0 90" radius="0.12" height="30" color="#EAB308"></a-cylinder>

    <!-- ============================================ -->
    <!-- 4. ZONA DE TRABAJO Y DELIMITACIÓN EN PISO    -->
    <!-- ============================================ -->
    <!-- Franja de Seguridad (Borde Amarillo) -->
    <a-plane position="0 0.01 -3" rotation="-90 0 0" width="7" height="5" color="#EAB308"></a-plane>
    <!-- Centro Operativo de Trabajo (Gris Oscuro) -->
    <a-plane position="0 0.02 -3" rotation="-90 0 0" width="6.6" height="4.6" color="#1F2937"></a-plane>

    <!-- Paso Peatonal (Líneas Blancas) -->
    <a-plane position="0 0.01 1.5" rotation="-90 0 0" width="14" height="0.8" color="#FFFFFF"></a-plane>
    <a-plane position="-4.5 0.01 -3" rotation="-90 0 0" width="0.8" height="8" color="#FFFFFF"></a-plane>

    <!-- ============================================ -->
    <!-- 5. CERRAMIENTO Y VALLAS DE SEGURIDAD       -->
    <!-- ============================================ -->
    <!-- Postes de Protección -->
    <a-box position="-3.3 1 -5.3" width="0.1" height="2" depth="0.1" color="#F59E0B"></a-box>
    <a-box position="3.3 1 -5.3" width="0.1" height="2" depth="0.1" color="#F59E0B"></a-box>
    <a-box position="-3.3 1 -0.7" width="0.1" height="2" depth="0.1" color="#F59E0B"></a-box>
    <a-box position="3.3 1 -0.7" width="0.1" height="2" depth="0.1" color="#F59E0B"></a-box>

    <!-- Rieles Superiores e Inferiores -->
    <a-box position="0 1.9 -5.3" width="6.6" height="0.05" depth="0.05" color="#F59E0B"></a-box>
    <a-box position="0 0.2 -5.3" width="6.6" height="0.05" depth="0.05" color="#F59E0B"></a-box>
    <a-box position="-3.3 1.9 -3" width="0.05" height="0.05" depth="4.6" color="#F59E0B"></a-box>
    <a-box position="-3.3 0.2 -3" width="0.05" height="0.05" depth="4.6" color="#F59E0B"></a-box>
    <a-box position="3.3 1.9 -3" width="0.05" height="0.05" depth="4.6" color="#F59E0B"></a-box>
    <a-box position="3.3 0.2 -3" width="0.05" height="0.05" depth="4.6" color="#F59E0B"></a-box>

    <!-- Paneles Acrílicos/Malla Traslúcida -->
    <a-plane position="0 1 -5.3" width="6.5" height="1.6" color="#F59E0B" material="transparent: true; opacity: 0.2"></a-plane>
    <a-plane position="-3.3 1 -3" rotation="0 90 0" width="4.5" height="1.6" color="#F59E0B" material="transparent: true; opacity: 0.2"></a-plane>
    <a-plane position="3.3 1 -3" rotation="0 -90 0" width="4.5" height="1.6" color="#F59E0B" material="transparent: true; opacity: 0.2"></a-plane>

    <!-- ============================================ -->
    <!-- 6. PANEL DE CONTROL HMI Y TABLERO ELÉCTRICO  -->
    <!-- ============================================ -->
    <!-- Estación de Control HMI -->
    <a-entity position="2.5 0 -0.5" rotation="0 -30 0">
      <a-cylinder position="0 0.6 0" radius="0.05" height="1.2" color="#374151"></a-cylinder>
      <a-box position="0 1.25 0" width="0.5" height="0.35" depth="0.08" rotation="-20 0 0" color="#1F2937"></a-box>
      <a-plane position="0 1.25 0.05" width="0.44" height="0.28" rotation="-20 0 0" color="#0284C7"></a-plane>
      <a-cylinder position="0.18 1.1 0.08" radius="0.035" height="0.04" rotation="70 0 0" color="#DC2626"></a-cylinder>
    </a-entity>

    <!-- Tablero Eléctrico Principal -->
    <a-box position="-8 2 -11.8" width="1.2" height="1.8" depth="0.3" color="#D1D5DB"></a-box>
    <a-box position="-8 2 -11.6" width="0.1" height="0.2" depth="0.05" color="#DC2626"></a-box>
    <a-sphere position="-8 2.7 -11.6" radius="0.05" color="#22C55E"></a-sphere>

    <!-- ============================================ -->
    <!-- 7. ACCESORIOS Y UTILERÍA INDUSTRIAL          -->
    <!-- ============================================ -->
    <!-- Tambores de Aceite en la esquina -->
    <a-cylinder position="-12 0.9 -9" radius="0.4" height="1.8" color="#1E3A8A"></a-cylinder>
    <a-cylinder position="-11 0.9 -9.5" radius="0.4" height="1.8" color="#1E3A8A"></a-cylinder>
    <a-cylinder position="-11.5 0.9 -8" radius="0.4" height="1.8" color="#DC2626"></a-cylinder>

    <!-- Estiba con Cajas de Almacenamiento -->
    <a-entity position="10 0 -8" rotation="0 -15 0">
      <a-box position="0 0.1 0" width="1.6" height="0.15" depth="1.4" color="#854D0E"></a-box>
      <a-box position="-0.3 0.5 -0.2" width="0.7" height="0.6" depth="0.7" color="#D97706"></a-box>
      <a-box position="0.4 0.5 0.2" width="0.6" height="0.6" depth="0.6" color="#B45309"></a-box>
      <a-box position="0 1.05 0" width="0.8" height="0.5" depth="0.8" color="#D97706"></a-box>
    </a-entity>

    <!-- ============================================ -->
    <!-- 8. MODELO CAD PRINCIPAL                     -->
    <!-- ============================================ -->
    <a-entity 
      gltf-model="#modeloCAD" 
      position="0 0 -3" 
      scale="0.1 0.1 0.1"
      shadow="cast: true; receive: true">
    </a-entity>

  </a-scene>
</body>
</html>
